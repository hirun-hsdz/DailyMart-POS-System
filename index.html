<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DailyMArt POS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="top">
        <h1>Daily Mart</h1>
        <nav id="nav" aria-label="Main">
            <button data-view="pos" class="on">CheckOut</button>
            <button data-view="products">Products</button>
            <button data-view="customer">Customer</button>
            <button data-view="orders">Orders</button>
        </nav>
    </header>

    <main>
        <section id="pos" class="view on">
            <div class="shelf">
            <div class="tools">
                <input id="search" type="search" placeholder="Search products" aria-label="Search products">
                <div id="cats" class="chips"></div>
            </div>
            <div id="grid" class="grid"></div>
            </div>
            <aside class="basket" aria-label="Current bill">
                <h2>Current Bill</h2>
                <label>Customer
                    <select id="custSel"></select>
                </label>
                <ul id="cart" class="cart"></ul>
                <dl class="sums">
                    <div>
                        <dt>Subtotal</dt>
                        <dd id="subtotal">0.00</dd>
                    </div>
                    <div>
                        <dt>Tax(10%)</dt>
                        <dd id="tax">0.00</dd>
                    </div>
                    <div class="grand"
                        <dt>Total</dt>
                        <dd id="total">0.00</dd>
                    </div>
                </dl>
                <div class="row">
                    <button id="clear" class="ghost">Clear Cart</button>
                    <button id="pay" class="primary">Charge</button>
                </div>
            </aside>
        </section>

        <section id="products" class="view">
            <div class="head">
                <h2>Products</h2>
                <button class="primary" data-add="products">Add Product</button>
            </div>
        </section>
    </main>


    

</body>

</html>
